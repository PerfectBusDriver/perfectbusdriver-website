<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Perfect Bus Driver, l'application Android des conducteurs de car et d'autocar : amplitude, temps de repos, traceur de circuit et 18 outils pratiques. Gratuite, en 7 langues.">
    <title>Perfect Bus Driver - Professional Coach Driver Assistant</title>
    <link rel="icon" type="image/png" href="car.png">
    <script>
        // Detect browser language and redirect
        (function() {
            const supportedLanguages = ['fr', 'en', 'es', 'pt', 'de', 'nl', 'it'];
            const defaultLang = 'fr';
            
            // Get browser language
            let browserLang = navigator.language || navigator.userLanguage;
            browserLang = browserLang.split('-')[0].toLowerCase();
            
            // Check if language is supported
            const targetLang = supportedLanguages.includes(browserLang) ? browserLang : defaultLang;
            
            // Detect base path (for GitHub Pages subfolders)
            const path = window.location.pathname;
            let basePath = '';
            
            // If we're in a subfolder (like /perfectbusdriver-website/)
            const pathParts = path.split('/').filter(p => p && p !== 'index.html');
            if (pathParts.length > 0) {
                basePath = '/' + pathParts[0];
            }
            
            // Redirect to language-specific index
            window.location.href = `${basePath}/${targetLang}/index.html`;
        })();
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(160deg, #0a1628 0%, #1a3357 100%);
            color: white;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #0aa5b8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .lang-fallback { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 16px; }
        .lang-fallback a { color: #8fb3d6; text-decoration: none; }
    </style>
    <!-- SEO:start -->
    <link rel="canonical" href="https://perfectbusdriver.github.io/perfectbusdriver-website/">
    <link rel="alternate" hreflang="fr" href="https://perfectbusdriver.github.io/perfectbusdriver-website/fr/index.html">
    <link rel="alternate" hreflang="en" href="https://perfectbusdriver.github.io/perfectbusdriver-website/en/index.html">
    <link rel="alternate" hreflang="es" href="https://perfectbusdriver.github.io/perfectbusdriver-website/es/index.html">
    <link rel="alternate" hreflang="pt" href="https://perfectbusdriver.github.io/perfectbusdriver-website/pt/index.html">
    <link rel="alternate" hreflang="de" href="https://perfectbusdriver.github.io/perfectbusdriver-website/de/index.html">
    <link rel="alternate" hreflang="nl" href="https://perfectbusdriver.github.io/perfectbusdriver-website/nl/index.html">
    <link rel="alternate" hreflang="it" href="https://perfectbusdriver.github.io/perfectbusdriver-website/it/index.html">
    <link rel="alternate" hreflang="x-default" href="https://perfectbusdriver.github.io/perfectbusdriver-website/">
    <!-- SEO:end -->
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Loading / Chargement / Cargando...</p>
        <nav class="lang-fallback" aria-label="Langues / Languages">
            <a href="fr/index.html" hreflang="fr" lang="fr">Français</a>
            <a href="en/index.html" hreflang="en" lang="en">English</a>
            <a href="es/index.html" hreflang="es" lang="es">Español</a>
            <a href="pt/index.html" hreflang="pt" lang="pt">Português</a>
            <a href="de/index.html" hreflang="de" lang="de">Deutsch</a>
            <a href="nl/index.html" hreflang="nl" lang="nl">Nederlands</a>
            <a href="it/index.html" hreflang="it" lang="it">Italiano</a>
        </nav>
    </div>
</body>
</html>
