<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Bus Driver - Professional Coach Driver Assistant</title>
    <link rel="icon" type="image/png" href="car.png">
    <script>
        // Detect browser language and redirect
        (function() {
            const supportedLanguages = ['fr', 'en', 'es', 'pt', 'de', 'nl', 'it'];
            const defaultLang = 'fr';
            
            // Get browser language
            let browserLang = navigator.language || navigator.userLanguage;
            browserLang = browserLang.split('-')[0].toLowerCase();
            
            // Check if language is supported
            const targetLang = supportedLanguages.includes(browserLang) ? browserLang : defaultLang;
            
            // Redirect to language-specific index
            window.location.href = `/${targetLang}/index.html`;
        })();
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Loading / Chargement / Cargando...</p>
    </div>
</body>
</html>
